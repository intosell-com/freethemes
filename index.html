<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قالب وب سایت آماده | آرشیو قالب‌های حرفه‌ای | FreeThemes</title><meta name="description" content="آرشیو قالب‌های وب سایت آماده با دسته‌بندی، پیش‌نمایش زنده، جستجو و صفحه‌بندی."><meta name="robots" content="index,follow"><link rel="canonical" href="https://freethemes.ir/"><style>@font-face{font-family:Vazir;src:url(https://cdn.jsdelivr.net/npm/vazir-font@30.1.0/dist/Vazir.woff2)}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182230;font-family:Vazir,Tahoma}.container{max-width:1200px;margin:auto;padding:20px}.hero{text-align:center;background:#fff;padding:45px}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.cat,.btn{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;cursor:pointer;text-decoration:none}.cat strong,.cat small{display:block}.cat small{color:#888;margin-top:5px}.toolbar{display:flex;gap:10px;margin:25px 0}.search{flex:1;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden}.preview{height:250px}.preview iframe{width:100%;height:100%;border:0}.body{padding:15px}.view{display:inline-block;background:#111827;color:#fff;padding:8px 12px;border-radius:8px;margin-top:10px}.pages{text-align:center;margin:25px}.pages button{padding:9px;margin:3px;border:1px solid #ddd;background:#fff;border-radius:8px}.active{background:#111827!important;color:#fff}.status{text-align:center;padding:20px}@media(max-width:800px){.cats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.cats{grid-template-columns:1fr}}</style></head><body><section class="hero"><h1>آرشیو قالب‌های وب سایت آماده</h1><p>قالب مناسب پروژه خود را پیدا کنید و پیش‌نمایش زنده آن را ببینید.</p></section><main class="container"><h2>دسته‌بندی‌های اصلی قالب وب‌سایت</h2><div id="cats" class="cats"></div><h2 id="templates">قالب‌های وب سایت</h2><div class="toolbar"><input id="search" class="search" placeholder="جستجوی قالب..."><button id="all" class="btn">همه قالب‌ها</button></div><div id="status" class="status">در حال دریافت قالب‌ها...</div><div id="grid" class="grid"></div><div id="pages" class="pages"></div></main><script>
const BASE="https://themes.freethemes.ir/";const SIZE=12;let C=[],T=[],A=new URLSearchParams(location.search).get("category")||"",P=1;
function cat(f){let n=(f||"").split("/").pop().toLowerCase();if(!/^index-.*\.html$/.test(n))return null;let s=n.slice(6,-5).split("-")[0];return C.some(x=>x.slug===s)?s:null}
function cats(){document.querySelector("#cats").innerHTML=C.map(x=>`<a class="cat ${A===x.slug?"active":""}" href="?category=${x.slug}"><strong>${x.name}</strong><small>${x.title}</small></a>`).join("")}
function draw(){let q=document.querySelector("#search").value.toLowerCase(),a=T.filter(x=>(!A||x.cat===A)&&(!q||x.file.toLowerCase().includes(q))),n=Math.max(1,Math.ceil(a.length/SIZE));if(P>n)P=n;document.querySelector("#grid").innerHTML=a.slice((P-1)*SIZE,P*SIZE).map(x=>`<article class="card"><div class="preview"><iframe loading="lazy" title="${x.title}" src="${BASE+x.file}"></iframe></div><div class="body"><b>${x.title}</b><br><small>${C.find(c=>c.slug===x.cat)?.name||x.cat}</small><br><a class="view" target="_blank" rel="noopener" href="${BASE+x.file}">مشاهده پیش‌نمایش</a></div></article>`).join("")||"<div>قالبی پیدا نشد.</div>";document.querySelector("#status").textContent=a.length+" قالب";document.querySelector("#pages").innerHTML=Array.from({length:n},(_,i)=>`<button class="${i+1===P?"active":""}" onclick="P=${i+1};draw()">${i+1}</button>`).join("")}

</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"CollectionPage","name":"آرشیو قالب‌های وب سایت آماده","url":"https://freethemes.ir/"}</script></body></html>

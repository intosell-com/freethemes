<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قالب وب سایت آماده | آرشیو قالب‌های حرفه‌ای FreeThemes</title>
<meta name="description" content="آرشیو قالب‌های وب سایت آماده با پیش‌نمایش زنده، دسته‌بندی هوشمند، جستجو و صفحه‌بندی.">
<link rel="canonical" href="https://freethemes.ir/">
<style>
@font-face{font-family:Vazir;src:url('https://cdn.jsdelivr.net/npm/vazir-font@30.1.0/dist/Vazir.woff2')}
body{font-family:Vazir,Tahoma;background:#f7f8fc;margin:0;color:#111}
.wrap{max-width:1200px;margin:auto;padding:25px}
.hero{text-align:center;background:white;padding:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border-radius:20px;overflow:hidden;border:1px solid #ddd}
iframe{width:100%;height:260px;border:0}
button{padding:10px 15px;border-radius:10px;border:1px solid #ddd;background:white;cursor:pointer}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero">
<h1>قالب وب سایت آماده با پیش‌نمایش زنده</h1>
<p>انتخاب قالب مناسب برای طراحی سایت حرفه‌ای</p>
<input id="search" placeholder="جستجوی قالب" style="width:80%;padding:14px">
</div>
<div class="wrap">
<h2>دسته‌بندی‌ها</h2>
<div id="cats"></div>
<h2>آخرین قالب‌ها</h2>
<div id="list" class="grid"></div>
<div id="pages"></div>
</div>
<script>
const base="https://themes.freethemes.ir/";
let data=[],cat="",page=1,size=12;
const names={shop:"فروشگاهی",business:"شرکتی",admin:"مدیریت",landing:"لندینگ",medical:"پزشکی",404:"404"};
function category(f){
 let n=f.split('/').pop();
 if(!n.startsWith("index-")) return null;
 return n.replace("index-","").split("-")[0];
}
function draw(){
 let q=document.querySelector("#search").value.toLowerCase();
 let list=data.filter(x=(!cat||x.cat==cat)&&x.file.toLowerCase().includes(q));
 document.querySelector("#list").innerHTML=list.map(x=>`
 <div class="card">
 <iframe loading="lazy" src="${base+x.file}"></iframe>
 <div style="padding:15px"><b>${x.file}</b><br>${names[x.cat]||x.cat}</div>
 </div>`).join("");
}
fetch("templates.json").then(r=>r.json()).then(x=>{
 data=x.map(a=>({file:a.file,cat:category(a.file)})).filter(a=>a.cat);
 cats.innerHTML=[...new Set(data.map(x=>x.cat))].map(c=>`<button onclick="cat='${c}';draw()">${names[c]||c}</button>`).join("");
 draw();
});
search.oninput=draw;
</script>
</body>
</html>
